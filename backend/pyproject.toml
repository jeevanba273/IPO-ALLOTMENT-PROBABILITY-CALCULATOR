[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ipo-intel"
version = "0.1.0"
description = "Backend for a personal IPO intelligence dashboard (India)"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6,<7",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pgserver>=0.1.4",
    "pytest>=8.2",
    "pytest-socket>=0.7",
]

[project.scripts]
ipo-intel = "ipo_intel.cli:main"

[tool.setuptools.packages.find]
include = ["ipo_intel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No network in tests: only loopback (the throwaway Postgres) is reachable.
addopts = ["-ra", "--strict-markers", "--allow-hosts=127.0.0.1,::1"]
filterwarnings = [
    # Starlette 1.x would rather its TestClient used the httpx2 package; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
