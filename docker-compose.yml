# Local development database: `docker compose up -d db`
# Matches DATABASE_URL in .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: ipo
      POSTGRES_DB: ipo_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipo -d ipo_intel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
